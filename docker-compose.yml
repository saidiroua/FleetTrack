services:
  db:
    image: postgis/postgis:15-3.4
    container_name: fleettrack-db
    environment:
      POSTGRES_DB: geolocation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleettrack-api
    ports:
      - "5000:5000"
    command: >
      sh -c "npx prisma generate && npm run dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/geolocation_db?schema=public
      JWT_SECRET: fleettrack_jwt_secret_key_2026_prod
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
